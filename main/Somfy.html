<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Somfy</title>
<style>
  :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
  body { margin: 2rem auto; max-width: 42rem; padding: 0 1rem; }
  section { border-top: 1px solid GrayText; margin-top: 1.5rem; padding-top: 1rem; }
  h1, h2, h3 { margin: 0 0 .8rem; }
  article { margin-top: 1rem; padding: .85rem; border: 1px solid GrayText; border-radius: .5rem; }
  input, button { font: inherit; padding: .5rem .7rem; }
  label { display: block; margin: .7rem 0; }
  label input { display: block; width: min(100%, 23rem); box-sizing: border-box; }
  #remote-members input, #blind-group-members input { display: inline; width: auto; }
  output { display: block; margin-top: .7rem; }
  .controls { display: flex; flex-wrap: wrap; gap: .5rem; }
</style>
<main>
  <h1>Somfy</h1>
  <p id="network" role="status">Connecting to the ESP32...</p>
  <p><a id="lan" hidden></a></p>
  <section id="setup" hidden>
    <h2>Join Wi-Fi</h2>
    <form id="join">
      <label>Network name (SSID)<input id="ssid" required maxlength="32" autocomplete="off"></label>
      <label>Wi-Fi password<input id="password" type="password" maxlength="64" autocomplete="off"></label>
      <button id="join-button">Join network</button>
    </form>
  </section>
  <div id="online" hidden>
    <section>
      <h2>Blinds</h2>
      <form id="add-blind">
        <label>Blind name<input id="blind-name" required maxlength="32"></label>
        <button id="add-button">Add blind</button>
      </form>
      <div id="blinds"></div>
    </section>
    <section>
      <h2>Blind groups</h2>
      <button id="add-blind-group" type="button">Add group</button>
      <form id="blind-group-form" hidden>
        <label>Group name<input id="blind-group-name" required maxlength="32"></label>
        <div id="blind-group-members"></div>
        <button id="save-blind-group">Save group</button>
        <button id="cancel-blind-group" type="button">Cancel</button>
      </form>
      <div id="blind-groups"></div>
    </section>
    <section>
      <h2>Physical remote groups</h2>
      <div id="groups"></div>
    </section>
    <section>
      <h2>Remote discovery</h2>
      <button id="scan" type="button">Start 30-second scan</button>
      <p id="scan-status"></p>
      <ul id="remotes"></ul>
      <form id="remote-group" hidden>
        <h3 id="remote-group-title"></h3>
        <p>Select the saved blinds controlled by this remote channel.</p>
        <div id="remote-members"></div>
        <button id="save-group">Save group</button>
        <button id="cancel-group" type="button">Cancel</button>
      </form>
    </section>
    <section>
      <h2>Wi-Fi</h2>
      <button id="reopen" type="button">Reopen Wi-Fi setup</button>
    </section>
    <section>
      <h2>Configuration backup</h2>
      <a href="/api/backup" download>Download backup</a>
      <form id="restore">
        <label>Backup file<input id="backup-file" type="file" accept=".esb" required></label>
        <button id="restore-button">Restore blinds</button>
      </form>
    </section>
    <section>
      <h2>Firmware update</h2>
      <p id="running-firmware">Running firmware: waiting for the bridge.</p>
      <p id="selected-firmware" aria-live="polite"></p>
      <p id="update-status" role="status"></p>
      <form id="firmware">
        <label>Application binary<input id="firmware-file" type="file" accept=".bin" required></label>
        <button id="firmware-button">Upload and restart</button>
      </form>
    </section>
  </div>
  <output id="result" aria-live="polite"></output>
</main>
<script>
  const byId = id => document.getElementById(id);
  let busy = false;
  let refreshing = false;
  let reopening = false;
  let lastBlindList = '';
  let lastBlindGroupList = '';
  let editingBlindGroupId = null;
  let setupSsid = '';
  let runningFirmware;
  let selectedFirmware;
  let pendingFirmware;
  let savedBlinds = [];
  let discoveryBlindId = null;
  let individualDiscovery = false;
  let discoveryGroupAddress = '';
  let groupAddress = '';
  let openDiscoveredGroup = false;
  let lastRemoteList = '';

  async function api(path, options) {
    const response = await fetch('/api' + path, {
      ...options, cache: 'no-store', signal: AbortSignal.timeout(4000)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'HTTP ' + response.status);
    return data;
  }

  function updateButtons() {
    byId('join-button').disabled = busy;
    byId('restore-button').disabled = busy;
    byId('firmware-button').disabled = busy || !selectedFirmware || Boolean(pendingFirmware);
    byId('scan').disabled = busy;
    byId('reopen').disabled = busy;
    byId('add-button').disabled = busy;
    byId('save-group').disabled = busy;
    byId('cancel-group').disabled = busy;
    byId('add-blind-group').disabled = busy || savedBlinds.length === 0;
    byId('save-blind-group').disabled = busy;
    byId('cancel-blind-group').disabled = busy;
    byId('blind-group-members').querySelectorAll('input').forEach(input => { input.disabled = busy; });
    byId('remote-members').querySelectorAll('input').forEach(input => { input.disabled = busy; });
    byId('online').querySelectorAll('button[data-unavailable]').forEach(button => {
      button.disabled = busy || button.dataset.unavailable === 'true';
    });
  }

  function blindButton(controls, label, unavailable, action) {
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = label;
    button.dataset.unavailable = String(unavailable);
    button.addEventListener('click', () => run(action));
    controls.append(button);
  }

  function blindCard(blind) {
    const card = document.createElement('article');
    const heading = document.createElement('h3');
    const detail = document.createElement('p');
    const controls = document.createElement('div');
    const individualAddresses = blind.individualAddresses || [];
    heading.textContent = blind.name;
    controls.className = 'controls';
    card.append(heading, detail, controls);

    if (blind.pairing === 'paired') {
      detail.textContent = 'Remote ' + blind.address + (blind.ready
        ? ' - Paired. Use the controls to test movement.'
        : ' - Paired. Control is unavailable. Check radio profile 1.');
      detail.textContent += blind.remoteAddress
        ? ' Group channel: ' + blind.remoteAddress + '.'
        : ' No group channel linked.';
      if (individualAddresses.length) {
        detail.textContent += ' Other linked channels: ' + individualAddresses.join(', ') + '.';
      }
      blindButton(controls, 'Open', !blind.ready, () => sendCommand(blind, 'open'));
      blindButton(controls, 'Close', !blind.ready, () => sendCommand(blind, 'close'));
      blindButton(controls, 'My / Stop', !blind.ready, () => sendCommand(blind, 'stop'));
      blindButton(controls, 'Set position', !blind.ready, () => setPosition(blind.id));
    } else if (blind.pairing === 'awaiting_confirmation') {
      detail.textContent = 'Confirm only if this blind jogged after the pairing signal. If it did not jog, put it into programming mode before retrying.';
      blindButton(controls, 'Confirm motor jog', false, () => confirmPairing(blind));
      blindButton(controls, 'Retry pairing', false, () => pairBlind(blind));
    } else {
      detail.textContent = 'Use the physical remote to put only this blind into programming mode, then send the pairing signal.';
      blindButton(controls, 'Send pairing signal', false, () => pairBlind(blind));
    }
    const position = document.createElement('p');
    position.dataset.blindPosition = blind.id;
    card.append(position);
    blindButton(controls, 'Rename', false, () => renameBlind(blind));
    blindButton(controls, 'Discover group channel', false, () => startDiscovery(blind.id, false, ''));
    if (blind.pairing === 'paired') {
      blindButton(controls, 'Discover another remote', false, () => startDiscovery(blind.id, true, ''));
      for (const address of individualAddresses) {
        blindButton(controls, 'Unlink ' + address, false, () => updatePhysicalRemote(blind.id, address, false));
      }
    }
    blindButton(controls, 'Set travel times', false, () => setTravelTimes(blind));
    if (blind.pairing === 'paired') {
      blindButton(controls, 'Record existing My position', false, () => setFavorite(blind));
      blindButton(controls, 'Save current position as motor My', !blind.ready, () => programFavorite(blind));
    }
    blindButton(controls, 'Remove', false, () => removeBlind(blind));
    return card;
  }

  function renderGroups(blinds) {
    const groups = new Map();
    for (const blind of blinds) {
      if (!blind.remoteAddress) continue;
      if (!groups.has(blind.remoteAddress)) groups.set(blind.remoteAddress, []);
      groups.get(blind.remoteAddress).push(blind);
    }
    const cards = [];
    for (const [address, members] of groups) {
      const card = document.createElement('article');
      const heading = document.createElement('h3');
      const detail = document.createElement('p');
      const controls = document.createElement('div');
      heading.textContent = members[0].groupName || 'Remote group ' + address;
      const groupChannels = members[0].groupChannels || [address];
      detail.textContent = members.map(blind => blind.name).join(', ') + '. Channels: ' + groupChannels.join(', ') + '.';
      controls.className = 'controls';
      card.append(heading, detail, controls);
      const unavailable = members.every(blind => !blind.ready);
      blindButton(controls, 'Rename group', false, () => renameGroup(address, heading.textContent));
      blindButton(controls, 'Delete group', false, () => deleteGroup(address, heading.textContent));
      blindButton(controls, 'Edit members', false, () => editGroup(address, null));
      blindButton(controls, 'Discover group remote', false, () => startDiscovery(null, false, address));
      for (const channel of groupChannels) {
        if (channel !== address) {
          blindButton(controls, 'Unlink group channel ' + channel, false,
            () => updateGroupChannel(address, channel, false));
        }
      }
      blindButton(controls, 'Open group', unavailable, () => sendGroup('/groups/' + address, 'open'));
      blindButton(controls, 'Close group', unavailable, () => sendGroup('/groups/' + address, 'close'));
      blindButton(controls, 'My / Stop group', unavailable, () => sendGroup('/groups/' + address, 'stop'));
      cards.push(card);
    }
    byId('groups').replaceChildren(...cards);
  }

  async function readBlinds() {
    const blinds = await api('/blinds', {});
    savedBlinds = blinds;
    const list = JSON.stringify(blinds.map(blind => ({ ...blind, position: null, targetPosition: null })));
    // Keep keyboard focus in place when a poll returns the same blinds.
    if (list !== lastBlindList) {
      byId('blinds').replaceChildren(...blinds.map(blindCard));
      renderGroups(blinds);
      lastBlindList = list;
    }
    for (const blind of blinds) {
      const position = byId('blinds').querySelector('[data-blind-position="' + blind.id + '"]');
      position.textContent = !blind.openMs || !blind.closeMs
        ? 'Set full opening and closing times to estimate position.'
        : blind.position == null ? 'Estimated position: unknown.' : 'Estimated position: ' + blind.position + '% open.';
      if (blind.targetPosition != null) position.textContent += ' Target: ' + blind.targetPosition + '% open.';
      if (blind.favoritePosition != null) position.textContent += ' Recorded My: ' + blind.favoritePosition + '% open.';
    }
    updateButtons();
  }

  async function readBlindGroups() {
    const groups = await api('/blind-groups', {});
    const list = JSON.stringify([groups, savedBlinds.map(blind => [blind.id, blind.name, blind.ready])]);
    if (list === lastBlindGroupList) return;
    byId('blind-groups').replaceChildren(...groups.map(group => {
      const card = document.createElement('article');
      const heading = document.createElement('h3');
      const detail = document.createElement('p');
      const controls = document.createElement('div');
      const members = savedBlinds.filter(blind => group.blindIds.includes(blind.id));
      const path = '/blind-groups/' + group.id;
      heading.textContent = group.name;
      detail.textContent = members.length ? members.map(blind => blind.name).join(', ') : 'No members.';
      controls.className = 'controls';
      card.append(heading, detail, controls);
      const unavailable = members.every(blind => !blind.ready);
      blindButton(controls, 'Open group', unavailable, () => sendGroup(path, 'open'));
      blindButton(controls, 'Close group', unavailable, () => sendGroup(path, 'close'));
      blindButton(controls, 'My / Stop group', unavailable, () => sendGroup(path, 'stop'));
      blindButton(controls, 'Edit group', false, () => editBlindGroup(group));
      blindButton(controls, 'Delete group', false, () => deleteBlindGroup(group));
      return card;
    }));
    lastBlindGroupList = list;
    updateButtons();
  }

  function editBlindGroup(group) {
    editingBlindGroupId = group?.id ?? null;
    byId('blind-group-name').value = group?.name ?? '';
    byId('blind-group-members').replaceChildren(...savedBlinds.map(blind => {
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.value = String(blind.id);
      checkbox.checked = group?.blindIds.includes(blind.id) ?? false;
      label.append(checkbox, ' ' + blind.name);
      return label;
    }));
    byId('blind-group-form').hidden = false;
    byId('blind-group-form').scrollIntoView({ block: 'nearest' });
  }

  byId('add-blind-group').addEventListener('click', () => editBlindGroup(null));
  byId('cancel-blind-group').addEventListener('click', () => { byId('blind-group-form').hidden = true; });
  byId('blind-group-form').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
      const name = byId('blind-group-name').value.trim();
      if (!name || new TextEncoder().encode(name).length > 32) {
        throw new Error('Enter a group name between 1 and 32 bytes.');
      }
      const blindIds = Array.from(byId('blind-group-members').querySelectorAll('input'))
        .filter(input => input.checked).map(input => Number(input.value));
      if (!blindIds.length) throw new Error('Select at least one blind.');
      const path = editingBlindGroupId === null ? '/blind-groups' : '/blind-groups/' + editingBlindGroupId + '/save';
      const { result } = await submitRequest(path, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, blindIds })
      });
      if (result !== 'blind_group_saved') throw new Error('Could not save the blind group.');
      byId('blind-group-form').hidden = true;
      byId('result').textContent = 'Group saved.';
      await readBlindGroups();
    });
  });

  async function deleteBlindGroup(group) {
    if (!confirm('Delete ' + group.name + '?')) return;
    const { result } = await submitRequest('/blind-groups/' + group.id + '/delete', { method: 'POST' });
    if (result !== 'blind_group_deleted') throw new Error('Could not delete the blind group.');
    if (editingBlindGroupId === group.id) byId('blind-group-form').hidden = true;
    byId('result').textContent = 'Group deleted.';
    await readBlindGroups();
  }

  async function readControls() {
    await readBlinds();
    await readBlindGroups();
    const scan = await api('/discovery', {});
    byId('scan-status').textContent = scan.active ? 'Listening. Press a button on the physical remote.' :
      scan.remotes.length ? 'Scan complete.' : 'No remotes found.';
    if (scan.overflow) byId('scan-status').textContent += ' The remote list is full.';
    const addresses = scan.remotes.map(remote => remote.address);
    const blind = individualDiscovery ? savedBlinds.find(entry => entry.id === discoveryBlindId) : null;
    const linked = blind?.individualAddresses || [];
    const group = discoveryGroupAddress && savedBlinds.find(entry => entry.remoteAddress === discoveryGroupAddress);
    const groupChannels = group ? group.groupChannels || [discoveryGroupAddress] : [];
    const list = JSON.stringify([addresses, blind?.remoteAddress, linked, groupChannels]);
    // Leave discovery buttons in place when repeated frames change only command details.
    if (list !== lastRemoteList) {
      byId('remotes').replaceChildren(...addresses.map(address => {
        const row = document.createElement('li');
        if (discoveryGroupAddress) {
          if (group && !groupChannels.includes(address)) {
            blindButton(row, 'Link group channel ' + address, false,
              () => updateGroupChannel(discoveryGroupAddress, address, true));
          } else {
            row.textContent = group ? address + ' is already linked.' : 'This group has no members.';
          }
        } else if (individualDiscovery) {
          if (blind && blind.remoteAddress !== address && !linked.includes(address)) {
            blindButton(row, 'Link remote ' + address, false,
              () => updatePhysicalRemote(blind.id, address, true));
          } else {
            row.textContent = address + ' is already linked or the blind was removed.';
          }
        } else {
          blindButton(row, 'Assign blinds to ' + address, false, () => editGroup(address, discoveryBlindId));
        }
        return row;
      }));
      lastRemoteList = list;
    }
    if (openDiscoveredGroup && addresses.length === 1 && savedBlinds.length) {
      openDiscoveredGroup = false;
      editGroup(addresses[0], discoveryBlindId);
    }
    if (!scan.active) openDiscoveredGroup = false;
    updateButtons();
  }

  function editGroup(address, preselectedId) {
    openDiscoveredGroup = false;
    groupAddress = address;
    const member = savedBlinds.find(blind => blind.remoteAddress === address);
    byId('remote-group-title').textContent = member?.groupName || 'Remote group ' + address;
    byId('remote-members').replaceChildren(...savedBlinds.map(blind => {
      const label = document.createElement('label');
      const input = document.createElement('input');
      input.type = 'checkbox';
      input.value = blind.id;
      input.dataset.address = blind.address;
      input.checked = blind.remoteAddress === address || blind.id === preselectedId;
      label.append(input, ' ' + blind.name + (blind.remoteAddress && blind.remoteAddress !== address
        ? ' (currently in ' + blind.remoteAddress + ')' : ''));
      return label;
    }));
    byId('remote-group').hidden = false;
    updateButtons();
    byId('remote-group').scrollIntoView({ block: 'nearest' });
  }

  async function refresh() {
    const state = await api('/network', {});
    setupSsid = state.setupSsid;
    byId('setup').hidden = state.mode !== 'setup';
    byId('online').hidden = state.mode !== 'online';
    const messages = {
      setup: state.error === 'join_failed' ? 'Could not join Wi-Fi. Check the network name and password.' :
        state.error === 'save_failed' ? 'Connected, but the ESP32 could not save the network.' : 'Choose your home Wi-Fi network.',
      joining: 'Joining Wi-Fi...',
      joined: 'Wi-Fi connected. Switch to your home network and open the address below.',
      online: 'Connected to Wi-Fi.',
      reopening: 'Join ' + setupSsid + ' and open http://192.168.4.1/.',
      unavailable: 'Wi-Fi setup is unavailable.'
    };
    byId('network').textContent = messages[state.mode] || 'Wi-Fi status unavailable.';
    const link = byId('lan');
    link.hidden = state.mode !== 'joined';
    if (state.mode === 'joined') {
      link.href = 'http://' + state.address + '/';
      link.textContent = link.href;
    }
    if (state.mode === 'online') {
      if (!runningFirmware || pendingFirmware) await readFirmware();
      await readControls();
    }
    updateButtons();
  }

  async function poll() {
    if (!busy && !refreshing && !reopening) {
      refreshing = true;
      try { await refresh(); }
      catch {
        if (byId('lan').hidden) byId('network').textContent = 'Waiting for the ESP32...';
      }
      finally {
        if (pendingFirmware && performance.now() >= pendingFirmware.deadline) {
          byId('update-status').textContent = 'Could not verify the running build. Check it when the bridge reconnects.';
          pendingFirmware = null;
          runningFirmware = null;
          updateButtons();
        }
        refreshing = false;
      }
    }
  }

  async function run(action) {
    if (busy) return;
    busy = true;
    byId('result').textContent = '';
    updateButtons();
    try { await action(); }
    catch (error) { byId('result').textContent = error.message; }
    finally {
      busy = false;
      updateButtons();
    }
  }

  async function waitForResult(requestId, timeoutMs) {
    const deadline = performance.now() + timeoutMs;
    while (performance.now() < deadline) {
      const result = await api('/requests/' + requestId, {});
      if (result.result !== 'pending') return result;
      await new Promise(resolve => setTimeout(resolve, 250));
    }
    throw new Error('Result unavailable. Check the blind before retrying.');
  }

  function firmwareLabel(image) {
    return image.version + ' (build ' + image.build.slice(0, 12) + ')';
  }

  async function readFirmware() {
    runningFirmware = await api('/firmware', {});
    byId('running-firmware').textContent = 'Running firmware: ' + firmwareLabel(runningFirmware);
    if (pendingFirmware) {
      const matches = pendingFirmware.build === runningFirmware.build;
      // The old firmware can still answer briefly after accepting the upload.
      if (matches || performance.now() >= pendingFirmware.deadline) {
        byId('update-status').textContent = matches
          ? 'The selected build is running.'
          : 'The bridge is running a different build than the uploaded file.';
        pendingFirmware = null;
      }
    }
  }

  async function firmwareInfo(file) {
    // ESP32 image header (24 bytes), first segment header (8), then the 256-byte app descriptor.
    const descriptorOffset = 24 + 8;
    const bytes = new Uint8Array(await file.slice(0, descriptorOffset + 256).arrayBuffer());
    if (bytes.length !== descriptorOffset + 256 || bytes[0] !== 0xe9 ||
        new DataView(bytes.buffer).getUint32(descriptorOffset, true) !== 0xabcd5432) {
      throw new Error('Select an ESP32 application binary.');
    }

    function readText(offset) {
      const field = bytes.subarray(descriptorOffset + offset, descriptorOffset + offset + 32);
      const end = field.indexOf(0);
      return new TextDecoder().decode(end < 0 ? field : field.subarray(0, end));
    }

    // ESP-IDF app descriptor offsets for version, project name, and the ELF SHA-256.
    const build = Array.from(bytes.subarray(descriptorOffset + 144, descriptorOffset + 176),
      byte => byte.toString(16).padStart(2, '0')).join('');
    return { version: readText(16), project: readText(48), build };
  }

  byId('firmware-file').addEventListener('change', async () => {
    const input = byId('firmware-file');
    const file = input.files[0];
    selectedFirmware = null;
    byId('selected-firmware').textContent = '';
    updateButtons();
    if (!file) return;
    try {
      const image = await firmwareInfo(file);
      if (input.files[0] !== file) return;
      if (!runningFirmware) await readFirmware();
      if (input.files[0] !== file) return;
      if (image.project !== runningFirmware.project) throw new Error('This file is from a different project.');
      selectedFirmware = image;
      byId('selected-firmware').textContent = 'Selected firmware: ' + firmwareLabel(image);
    } catch (error) {
      if (input.files[0] === file) byId('selected-firmware').textContent = error.message;
    }
    updateButtons();
  });

  byId('firmware').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
      const file = byId('firmware-file').files[0];
      if (!file || !selectedFirmware || pendingFirmware) return;
      const image = selectedFirmware;
      byId('update-status').textContent = '';
      byId('result').textContent = 'Uploading firmware...';
      let response;
      try {
        response = await fetch('/api/firmware', {
          method: 'POST', headers: { 'Content-Type': 'application/octet-stream' },
          body: file, signal: AbortSignal.timeout(135000)
        });
      } catch {
        // The bridge can reboot before the browser receives the upload response.
      }
      if (response && !response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.error || 'HTTP ' + response.status);
      }
      byId('firmware-file').value = '';
      selectedFirmware = null;
      // Allow 30 seconds for the bridge to reboot and rejoin Wi-Fi.
      pendingFirmware = { build: image.build, deadline: performance.now() + 30000 };
      byId('result').textContent = '';
      byId('update-status').textContent = response
        ? 'Update accepted. Reconnecting to check the running build...'
        : 'Upload response unavailable. Reconnecting to check the running build...';
    });
  });

  byId('restore').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
      const input = byId('backup-file');
      const file = input.files[0];
      if (!file || !confirm('Restore saved blinds and groups from this backup?')) return;
      const { result } = await submitRequest('/backup', {
        method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file
      });
      const messages = {
        invalid_backup: 'The file is invalid or the blind registry is unavailable.',
        backup_identity_conflict: 'Backup conflicts with a saved virtual remote. Restore it on a fresh bridge.',
        position_busy: 'Wait for the timed move to finish before restoring.',
        restore_write_failed: 'Restore could not finish. Restart the bridge to let it recover.'
      };
      if (result !== 'backup_restored') throw new Error(messages[result] || result);
      input.value = '';
      byId('result').textContent = 'Blinds and groups restored. Run a full Open or Close to reestablish positions.';
      await readBlinds();
      await readBlindGroups();
    });
  });

  byId('join').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
      await api('/network/join', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid: byId('ssid').value, password: byId('password').value })
      });
      byId('password').value = '';
      byId('setup').hidden = true;
      byId('network').textContent = 'Joining Wi-Fi...';
    });
  });

  byId('reopen').addEventListener('click', () => run(async () => {
    await api('/network/setup', { method: 'POST' });
    reopening = true;
    byId('online').hidden = true;
    byId('network').textContent = 'Join the open ' + setupSsid + ' network and visit http://192.168.4.1/.';
  }));

  async function startDiscovery(blindId, individual, groupAddress) {
    byId('remote-group').hidden = true;
    byId('remotes').scrollIntoView({ block: 'nearest' });
    const { requestId } = await api('/discovery', { method: 'POST' });
    const { result } = await waitForResult(requestId, 5000);
    if (result !== 'discovery_started') throw new Error('The scan did not start.');
    discoveryBlindId = blindId;
    individualDiscovery = individual;
    discoveryGroupAddress = groupAddress;
    lastRemoteList = '';
    openDiscoveredGroup = !individual && !groupAddress;
    await readControls();
  }

  byId('scan').addEventListener('click', () => run(() => startDiscovery(null, false, '')));

  async function updateGroupChannel(group, address, linked) {
    const action = linked ? 'link-channel' : 'unlink-channel';
    const { result } = await submitRequest('/groups/' + group + '/' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address })
    });
    if (result === 'group_channel_limit') throw new Error('This group already has four additional channels linked.');
    if (result !== 'group_channels_saved') throw new Error('Could not save group channel: ' + result);
    byId('result').textContent = linked ? 'Group channel linked.' : 'Group channel unlinked.';
    await readControls();
  }

  async function updatePhysicalRemote(id, address, linked) {
    const action = linked ? 'link-remote' : 'unlink-remote';
    const { result } = await submitRequest('/blinds/' + id + '/' + action, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ address })
    });
    if (result === 'physical_remote_limit') throw new Error('This blind already has four additional channels linked.');
    if (result !== 'physical_remotes_saved') throw new Error('Could not save remote link: ' + result);
    byId('result').textContent = linked ? 'Remote linked.' : 'Remote unlinked.';
    await readControls();
  }

  async function submitRequest(path, options) {
    const { requestId } = await api(path, options);
    return waitForResult(requestId, 5000);
  }

  async function pairBlind(blind) {
    byId('result').textContent = blind.name + ': sending pairing signal...';
    const { result } = await submitRequest('/blinds/' + blind.id + '/pair', { method: 'POST' });
    const message = result === 'transmitted'
      ? 'Pairing signal sent. Confirm only if the motor jogged.'
      : radioMessage(result);
    byId('result').textContent = blind.name + ': ' + message;
    await readBlinds();
  }

  async function confirmPairing(blind) {
    const { result } = await submitRequest('/blinds/' + blind.id + '/confirm', { method: 'POST' });
    byId('result').textContent = blind.name + (result === 'pairing_confirmed'
      ? ': pairing saved. Test the blind using Open, Close, or My / Stop.'
      : ': pairing could not be confirmed. Refresh the blind status and check the pairing signal.');
    await readBlinds();
  }

  function radioMessage(result) {
    const messages = {
      transmitted: 'Radio transmission completed. Check that this blind responded.',
      not_sent: 'Command was not transmitted. Check radio profile 1 and the blind status.',
      transmission_uncertain: 'Transmission incomplete. Check the blind before retrying.',
      transmitted_with_cleanup_error: 'Transmission completed, but radio cleanup failed.'
    };
    return messages[result] || result;
  }

  async function setPosition(id) {
    const blind = savedBlinds.find(entry => entry.id === id);
    const entered = prompt('Percent open (0 closed, 100 open)', blind.position ?? '');
    if (entered === null) return;
    if (!/^\d{1,3}$/.test(entered.trim()) || Number(entered) > 100) {
      throw new Error('Enter a whole percentage from 0 to 100.');
    }
    const { result } = await submitRequest('/blinds/' + id + '/position', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ position: Number(entered) })
    });
    const messages = {
      position_started: 'Movement started. Check the estimated position.',
      position_unchanged: 'Already at the estimated target.',
      position_busy: 'Wait for the active timed move or stop that blind.',
      position_unavailable: 'Check radio readiness and calibration. Run a full Open or Close first.',
      position_too_close: 'Target is too close for a timed move.',
      position_not_started: 'The bridge could not schedule the move. Check the blind before retrying.'
    };
    byId('result').textContent = blind.name + ': ' + (messages[result] || result);
    await readBlinds();
  }

  async function sendCommand(blind, command) {
    byId('result').textContent = blind.name + ': sending ' + command + '...';
    const { result } = await submitRequest('/blinds/' + blind.id + '/commands', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command })
    });
    byId('result').textContent = blind.name + ': ' + radioMessage(result);
    await readBlinds();
  }

  async function changeBlind(blind, action, body, expected) {
    const options = { method: 'POST' };
    if (body !== null) {
      options.headers = { 'Content-Type': 'application/json' };
      options.body = JSON.stringify(body);
    }
    const { result } = await submitRequest('/blinds/' + blind.id + '/' + action, options);
    if (result !== expected) throw new Error('Could not save change: ' + result);
    byId('result').textContent = 'Change saved.';
    await readBlinds();
  }

  async function renameBlind(blind) {
    const entered = prompt('Blind name', blind.name);
    if (entered === null) return;
    const name = entered.trim();
    if (!name || new TextEncoder().encode(name).length > 32) {
      throw new Error('Enter a blind name between 1 and 32 bytes.');
    }
    await changeBlind(blind, 'rename', { name }, 'blind_renamed');
  }

  async function removeBlind(blind) {
    if (confirm('Remove ' + blind.name + ' from this bridge? Its motor pairing will remain.')) {
      await changeBlind(blind, 'remove', null, 'blind_removed');
    }
  }

  byId('cancel-group').addEventListener('click', () => {
    byId('remote-group').hidden = true;
    openDiscoveredGroup = false;
  });

  byId('remote-group').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
      const inputs = Array.from(byId('remote-members').querySelectorAll('input'));
      const blinds = await api('/blinds', {});
      const changes = [];
      for (const input of inputs) {
        const blind = blinds.find(entry => String(entry.id) === input.value && entry.address === input.dataset.address);
        if (!blind) throw new Error('The blind list changed. Reopen the group and try again.');
        if (input.checked && blind.remoteAddress !== groupAddress) {
          changes.push({ id: blind.id, address: groupAddress });
        } else if (!input.checked && blind.remoteAddress === groupAddress) {
          changes.push({ id: blind.id, address: '' });
        }
      }
      let saved = 0;
      try {
        for (const change of changes) {
          const { result } = await submitRequest('/blinds/' + change.id + '/remote', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ address: change.address })
          });
          if (result !== 'remote_saved') throw new Error(result);
          ++saved;
        }
      } catch (error) {
        throw new Error('Saved ' + saved + ' of ' + changes.length + ' changes. Retry saving to apply the rest.');
      }
      byId('remote-group').hidden = true;
      byId('result').textContent = 'Group membership saved.';
      await readBlinds();
    });
  });

  async function programFavorite(blind) {
    if (!confirm('Is ' + blind.name + ' stopped at the new favorite, away from its existing My position? ' +
      'Programming at the existing My position can erase it.')) return;
    const path = '/blinds/' + blind.id + '/favorite-';
    byId('result').textContent = 'Sending the motor My programming command...';
    const { requestId } = await api(path + 'program', { method: 'POST' });
    // The long My burst takes about five seconds on the radio.
    const { result } = await waitForResult(requestId, 15000);
    if (result !== 'favorite_jog_pending') {
      const messages = {
        favorite_program_busy: 'Wait for the blind and any timed move to stop.',
        favorite_program_unavailable: 'The blind needs to be ready with a known position.',
        favorite_already_recorded: 'Move away from the recorded My position before programming.',
        favorite_program_not_sent: 'The programming command could not be sent.'
      };
      throw new Error(messages[result] || result);
    }
    const jogged = confirm('Did ' + blind.name + ' jog after the programming command?');
    const { result: finished } = await submitRequest(path + (jogged ? 'confirm' : 'discard'), { method: 'POST' });
    if (finished === 'favorite_saved') {
      byId('result').textContent = 'My position saved. Move away and press My to verify that the blind returns.';
    } else if (finished === 'favorite_program_discarded') {
      byId('result').textContent = 'Motor programming unconfirmed. The bridge kept its previous My setting.';
    } else {
      throw new Error('Could not finish My programming: ' + finished);
    }
    await readBlinds();
  }

  async function setFavorite(blind) {
    const entry = prompt('Where does the motor stop when you press My while idle? Enter percent open, or leave blank to clear this record.',
      blind.favoritePosition ?? '');
    if (entry === null) return;
    const position = entry.trim() === '' ? null : Number(entry);
    if (position !== null && (!Number.isInteger(position) || position < 0 || position > 100)) {
      throw new Error('Enter a whole percentage from 0 to 100.');
    }
    await changeBlind(blind, 'favorite', { position }, 'favorite_saved');
  }

  async function setTravelTimes(blind) {
    const opening = prompt('Full opening time in seconds', blind.openMs ? blind.openMs / 1000 : '');
    if (opening === null) return;
    const closing = prompt('Full closing time in seconds', blind.closeMs ? blind.closeMs / 1000 : '');
    if (closing === null) return;
    const openMs = Math.round(Number(opening) * 1000);
    const closeMs = Math.round(Number(closing) * 1000);
    if (![openMs, closeMs].every(ms => Number.isFinite(ms) && ms >= 1 && ms <= 600000)) {
      throw new Error('Enter opening and closing times between 0.001 and 600 seconds.');
    }
    await changeBlind(blind, 'calibrate', { openMs, closeMs }, 'travel_times_saved');
    byId('result').textContent = 'Travel times saved. Run a full Open or Close to establish an estimate.';
  }

  async function renameGroup(address, currentName) {
    const entered = prompt('Group name', currentName);
    if (entered === null) return;
    const name = entered.trim();
    if (!name || new TextEncoder().encode(name).length > 32) {
      throw new Error('Enter a group name between 1 and 32 bytes.');
    }
    const { result } = await submitRequest('/groups/' + address + '/rename', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    if (result !== 'group_renamed') throw new Error('Could not save group name.');
    byId('result').textContent = 'Group name saved.';
    await readBlinds();
  }

  async function deleteGroup(address, name) {
    if (!confirm('Delete ' + name + ' and unlink its blinds? The blinds will stay paired.')) return;
    const { result } = await submitRequest('/groups/' + address + '/delete', { method: 'POST' });
    if (groupAddress === address) byId('remote-group').hidden = true;
    await readBlinds();
    if (result !== 'group_deleted') throw new Error('Could not fully delete group. Check its remaining members.');
    byId('result').textContent = 'Group deleted.';
  }

  async function sendGroup(path, command) {
    const { result } = await submitRequest(path + '/commands', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command })
    });
    const messages = {
      group_transmitted: 'Commands transmitted to all group members.',
      group_partially_transmitted: 'Only some group commands transmitted. Check each blind.',
      group_not_transmitted: 'No group commands completed. Check each blind before retrying.'
    };
    byId('result').textContent = messages[result] || result;
    await readBlinds();
  }

  byId('add-blind').addEventListener('submit', event => {
    event.preventDefault();
    run(async () => {
      const input = byId('blind-name');
      const name = input.value.trim();
      if (!name || new TextEncoder().encode(name).length > 32) {
        throw new Error('Enter a blind name between 1 and 32 bytes.');
      }
      const { result } = await submitRequest('/blinds', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
      });
      if (result !== 'blind_created') throw new Error('Could not save the blind. Check the registry and try again.');
      input.value = '';
      byId('result').textContent = name + ' added. Follow its pairing instructions.';
      await readBlinds();
    });
  });

  poll();
  setInterval(poll, 1000);
</script>
</html>
